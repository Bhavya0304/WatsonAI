# /etc/nginx/sites-available/watson  (then: ln -s ../sites-available/watson ../sites-enabled/)
# TLS lines are added by `certbot --nginx -d darwinlabs.org -d www.darwinlabs.org`.

server {
    listen 80;
    server_name darwinlabs.org www.darwinlabs.org;

    root /srv/watson/frontend/dist;
    index index.html;

    # API → uvicorn on localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 64k;
    }

    # Hashed assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes (/, /admin, /admin/sessions/…)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
